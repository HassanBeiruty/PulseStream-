name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Shared-core unit tests (normalizer, candles, hub, alerts, VWAP, OMS)
      - name: Install root dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      # Frontend: lint + production build (both data modes must compile)
      #
      # 'npm install', not 'npm ci': the frontend toolchain (oxlint, rolldown,
      # lightningcss) ships wasm32-wasi bindings whose @emnapi/* peer deps npm
      # only hoists into the tree on Linux. A lockfile regenerated on the Windows
      # dev box therefore can never satisfy 'npm ci' on the Linux runner — it
      # aborts with "Missing: @emnapi/runtime from lock file". 'npm install' still
      # honours every version the lockfile pins, and it is the same command the
      # Vercel build runs (see vercel.json), so CI exercises the real deploy path.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build (hub mode)
        working-directory: frontend
        run: npm run build

      - name: Build (direct mode — the Vercel deploy path)
        working-directory: frontend
        run: npm run build
        env:
          VITE_DATA_MODE: direct
